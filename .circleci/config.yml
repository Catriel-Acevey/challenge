version: 2.1

orbs:
  python: circleci/python@2.0.3
  coveralls: coveralls/coveralls@2.2.5

jobs:
  build_and_test:
    docker:
      # Main Python container
      - image: cimg/python:3.11
        environment:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: challenge_db_test
          POKEAPI_BASE_URL: https://pokeapi.co/api/v2/pokemon
          COVERALLS_REPO_TOKEN: qZrdUAlzI2SVRRuraQW35uKpj87H3V29D
      # Secondary Database container
      - image: cimg/postgres:15.0
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: challenge_db_test

    steps:
      - checkout
      
      # Install Python dependencies
      # - python/install-packages:
      #     pkg-manager: pip
      #     app-dir: ./backend # Check this path if requirements.txt is in the root

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt -r backend/requirements.test.txt

      # Wait for the database to accept connections before running tests
      - run:
          name: Wait for Postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 1m

      # Run tests
      - run:
          name: Run tests with coverage
          command: |
            cd backend
            pytest --cov=. -v

      # 2. Enviar a Coveralls usando la CLI de Python
      - run:
          name: Upload coverage to Coveralls
          command: |
            cd backend
            coveralls

      - persist_to_workspace:
          root: ~/project
          paths:
            - .

      # Coveralls step commented out
      # - coveralls/upload:
      #     parallel: true
      #     flag_name: Test 1
      #     verbose: true

workflows:
  build_test_deploy:
    jobs:
      - build_and_test